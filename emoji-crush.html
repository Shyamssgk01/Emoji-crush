<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji Crush 🌟</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0f0c24;
  --panel: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.1);
  --pink: #ff6fd8;
  --purple: #7b61ff;
  --cyan: #00e5ff;
  --gold: #ffd600;
  --green: #00e676;
  --cell: 64px;
  --gap: 5px;
}

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  color: #fff;
  overflow-x: hidden;
  padding-bottom: 30px;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 15% 15%, rgba(123,97,255,0.18) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 85%, rgba(255,111,216,0.14) 0%, transparent 55%);
  pointer-events: none;
  z-index: 0;
}

.title-wrap {
  position: relative; z-index: 1;
  text-align: center; padding: 22px 20px 8px;
}
.title-wrap h1 {
  font-family: 'Fredoka One', cursive;
  font-size: 2.8rem;
  background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 50%, var(--cyan) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  filter: drop-shadow(0 0 20px rgba(255,111,216,0.4));
}
.subtitle {
  color: rgba(255,255,255,0.4); font-size: 0.8rem;
  letter-spacing: 2px; text-transform: uppercase; margin-top: 2px;
}

.hud {
  position: relative; z-index: 1;
  display: flex; gap: 10px; padding: 10px 20px;
  width: 100%; max-width: 540px;
}
.hud-card {
  flex: 1; background: var(--panel); border: 1px solid var(--border);
  border-radius: 16px; padding: 10px 12px; text-align: center; backdrop-filter: blur(10px);
}
.hud-label {
  font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1.5px;
  color: rgba(255,255,255,0.4); font-weight: 800;
}
.hud-val { font-family: 'Fredoka One', cursive; font-size: 1.6rem; line-height: 1.2; color: var(--gold); }
.hud-val.c { color: var(--cyan); }
.hud-val.p { color: var(--pink); }

.level-track {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 6px; padding: 6px 20px 4px;
}
.l-dot {
  width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fredoka One', cursive; font-size: 0.9rem;
  color: rgba(255,255,255,0.25); transition: all 0.4s ease; flex-shrink: 0;
}
.l-dot.active { border-color: var(--pink); color: #fff; background: rgba(255,111,216,0.2); box-shadow: 0 0 14px rgba(255,111,216,0.5); }
.l-dot.done { background: var(--green); border-color: var(--green); color: #0f0c24; box-shadow: 0 0 10px var(--green); }
.l-line { flex: 1; height: 3px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
.l-line-fill { height: 100%; background: var(--green); width: 0%; transition: width 0.5s ease; border-radius: 4px; }

.level-name {
  position: relative; z-index: 1; text-align: center; padding: 0 20px 6px;
  font-size: 0.78rem; letter-spacing: 1.5px; text-transform: uppercase;
  color: rgba(255,255,255,0.35); font-weight: 800;
}
.level-name span { color: var(--cyan); }

.progress-wrap { position: relative; z-index: 1; width: 100%; max-width: 540px; padding: 4px 20px 8px; }
.progress-info { display: flex; justify-content: space-between; font-size: 0.72rem; color: rgba(255,255,255,0.45); margin-bottom: 5px; font-weight: 700; }
.progress-track { height: 8px; background: rgba(255,255,255,0.07); border-radius: 10px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--purple), var(--pink)); width: 0%; transition: width 0.6s ease; box-shadow: 0 0 8px var(--pink); }

.board-wrap { position: relative; z-index: 1; padding: 0 12px; }
#board {
  display: grid;
  grid-template-columns: repeat(8, var(--cell));
  gap: var(--gap); padding: 12px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 22px; box-shadow: 0 0 50px rgba(123,97,255,0.12), inset 0 1px 0 rgba(255,255,255,0.05);
}

.cell {
  width: var(--cell); height: var(--cell); border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.9rem; cursor: pointer;
  background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.07);
  transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
  user-select: none; position: relative;
}
.cell:hover { transform: scale(1.1); background: rgba(255,255,255,0.1); z-index: 2; }
.cell.selected {
  background: rgba(255,111,216,0.22); border-color: var(--pink);
  box-shadow: 0 0 18px rgba(255,111,216,0.55), inset 0 0 10px rgba(255,111,216,0.15);
  transform: scale(1.14); z-index: 3;
  animation: sel-pulse 0.9s ease-in-out infinite alternate;
}
@keyframes sel-pulse {
  from { box-shadow: 0 0 12px rgba(255,111,216,0.4); }
  to   { box-shadow: 0 0 26px rgba(255,111,216,0.85); }
}
.cell.hint {
  animation: hint-glow 0.6s ease-in-out infinite alternate; z-index: 2;
}
@keyframes hint-glow {
  from { box-shadow: 0 0 0 rgba(0,229,255,0); }
  to   { box-shadow: 0 0 18px rgba(0,229,255,0.7); border-color: var(--cyan); }
}

@keyframes pop-out {
  0%   { transform: scale(1); opacity: 1; }
  45%  { transform: scale(1.4); opacity: 0.7; }
  100% { transform: scale(0); opacity: 0; }
}
@keyframes drop-in {
  from { transform: translateY(-80px) scale(0.6); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%      { transform: translateX(-7px); }
  40%      { transform: translateX(7px); }
  60%      { transform: translateX(-4px); }
  80%      { transform: translateX(4px); }
}
.cell.do-shake { animation: shake 0.35s ease; }
.cell.do-pop   { animation: pop-out 0.4s ease forwards; }
.cell.do-drop  { animation: drop-in 0.38s cubic-bezier(0.22,1,0.36,1) forwards; }

#fx-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

.fscore {
  position: fixed; font-family: 'Fredoka One', cursive; font-size: 1.7rem;
  color: var(--gold); text-shadow: 0 2px 12px rgba(255,214,0,0.6);
  pointer-events: none; z-index: 20;
  animation: fscore-up 1.1s ease-out forwards;
}
@keyframes fscore-up {
  0%   { opacity: 1; transform: translateY(0) scale(0.7); }
  20%  { transform: translateY(-10px) scale(1.1); }
  100% { opacity: 0; transform: translateY(-90px) scale(1); }
}

.action-row {
  position: relative; z-index: 1;
  display: flex; gap: 10px; padding: 10px 20px 0;
}
.btn {
  flex: 1; padding: 12px 0; border: none; border-radius: 50px;
  font-family: 'Fredoka One', cursive; font-size: 1rem; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s; letter-spacing: 0.3px;
}
.btn:hover { transform: scale(1.05); }
.btn:active { transform: scale(0.96); }
.btn-hint { background: rgba(0,229,255,0.12); color: var(--cyan); border: 1.5px solid rgba(0,229,255,0.3); }
.btn-shuffle { background: rgba(255,111,216,0.12); color: var(--pink); border: 1.5px solid rgba(255,111,216,0.3); }

.overlay {
  position: fixed; inset: 0; background: rgba(10,8,28,0.88); backdrop-filter: blur(14px);
  display: flex; align-items: center; justify-content: center;
  z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
}
.overlay.show { opacity: 1; pointer-events: all; }
.modal {
  background: linear-gradient(145deg, #1a1535, #0f0c24);
  border: 1px solid rgba(255,255,255,0.12); border-radius: 28px;
  padding: 40px 32px 34px; text-align: center; max-width: 340px; width: 90%;
  transform: scale(0.8) translateY(20px); transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: 0 40px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.07);
}
.overlay.show .modal { transform: scale(1) translateY(0); }
.modal-icon { font-size: 4rem; display: block; margin-bottom: 12px; }
.modal h2 {
  font-family: 'Fredoka One', cursive; font-size: 2rem;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px;
}
.modal p { color: rgba(255,255,255,0.55); font-size: 0.9rem; line-height: 1.6; margin-bottom: 22px; }
.modal .stars { font-size: 2.2rem; letter-spacing: 4px; display: block; margin-bottom: 18px; }
.mbtn {
  display: block; width: 100%; padding: 14px 0; border: none; border-radius: 50px;
  font-family: 'Fredoka One', cursive; font-size: 1.05rem; cursor: pointer;
  transition: transform 0.15s; margin-bottom: 10px;
}
.mbtn:last-child { margin-bottom: 0; }
.mbtn:hover { transform: scale(1.04); }
.mbtn:active { transform: scale(0.97); }
.mbtn-primary { background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff; box-shadow: 0 8px 24px rgba(123,97,255,0.35); }
.mbtn-secondary { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.12); }

#confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 49; display: none; }

@media (max-width: 580px) {
  :root { --cell: 40px; --gap: 4px; }
  .cell { font-size: 1.2rem; border-radius: 9px; }
  .title-wrap h1 { font-size: 2rem; }
  #board { padding: 8px; border-radius: 16px; }
  .hud-val { font-size: 1.3rem; }
}
</style>
</head>
<body>

<canvas id="fx-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>

<div class="title-wrap">
  <h1>✨ Emoji Crush ✨</h1>
  <div class="subtitle">Match • Crush • Win</div>
</div>

<div class="hud">
  <div class="hud-card"><div class="hud-label">Score</div><div class="hud-val" id="hud-score">0</div></div>
  <div class="hud-card"><div class="hud-label">Level</div><div class="hud-val c" id="hud-level">1</div></div>
  <div class="hud-card"><div class="hud-label">Moves</div><div class="hud-val p" id="hud-moves">20</div></div>
</div>

<div class="level-track" id="level-track"></div>
<div class="level-name">Level — <span id="lname">Starter Garden</span></div>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-label">Progress to goal</span>
    <span id="prog-pct">0%</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="prog-fill"></div></div>
</div>

<div class="board-wrap"><div id="board"></div></div>

<div class="action-row">
  <button class="btn btn-hint"    onclick="showHint()">💡 Hint</button>
  <button class="btn btn-shuffle" onclick="doShuffle(false)">🔀 Shuffle</button>
</div>

<!-- WIN -->
<div class="overlay" id="ov-win">
  <div class="modal">
    <span class="modal-icon">🎉</span>
    <h2 id="win-title">Level Complete!</h2>
    <span class="stars" id="win-stars">⭐⭐⭐</span>
    <p id="win-msg">Amazing!</p>
    <button class="mbtn mbtn-primary" id="btn-next">Next Level →</button>
    <button class="mbtn mbtn-secondary" onclick="retryLevel()">Play Again 🔄</button>
  </div>
</div>

<!-- FAIL -->
<div class="overlay" id="ov-fail">
  <div class="modal">
    <span class="modal-icon">😢</span>
    <h2>No More Moves!</h2>
    <p id="fail-msg">You ran out of moves. Try again!</p>
    <button class="mbtn mbtn-primary" onclick="retryLevel()">Try Again 🔄</button>
  </div>
</div>

<!-- DONE -->
<div class="overlay" id="ov-done">
  <div class="modal">
    <span class="modal-icon">🏆</span>
    <h2>You Won!</h2>
    <p>All 5 levels crushed!<br>Final Score: <strong id="final-score" style="color:var(--gold);font-family:'Fredoka One',cursive;font-size:1.2rem">0</strong></p>
    <button class="mbtn mbtn-primary" onclick="fullRestart()">Play Again 🎮</button>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────
var COLS = 8, ROWS = 8;

var LEVELS = [
  { id:1, name:'Starter Garden', emojis:['🌸','🌟','🍀','🦋','🌈'],                    moves:20, target:1000 },
  { id:2, name:'Ocean Vibes',    emojis:['🐠','🐙','🦈','🐚','🦀','🌊'],              moves:22, target:2000 },
  { id:3, name:'Space Candy',    emojis:['🚀','⭐','🌙','👽','🪐','💫','☄️'],         moves:25, target:3500 },
  { id:4, name:'Jungle Fiesta',  emojis:['🦁','🐸','🦜','🐵','🌴','🍌','🐍'],        moves:28, target:5000 },
  { id:5, name:'Ultimate Crush', emojis:['🔥','💎','⚡','❄️','🎯','💥','🌟','🎪'],   moves:30, target:7500 }
];

// ── STATE ────────────────────────────────────────
var G = { levelIdx:0, score:0, moves:0, board:[], selected:null, busy:false, hintCells:[] };

// ── BOARD LOGIC ──────────────────────────────────
function randEmoji(emojis) {
  return emojis[Math.floor(Math.random() * emojis.length)];
}

function makeBoard(emojis) {
  var board = [];
  for (var r = 0; r < ROWS; r++) {
    board[r] = [];
    for (var c = 0; c < COLS; c++) {
      var e, tries = 0;
      do {
        e = randEmoji(emojis);
        tries++;
      } while (tries < 10 && (
        (c >= 2 && board[r][c-1] === e && board[r][c-2] === e) ||
        (r >= 2 && board[r-1][c] === e && board[r-2][c] === e)
      ));
      board[r][c] = e;
    }
  }
  return board;
}

function getMatches(board) {
  var matched = {};
  var r, c, e, end, k;
  // Horizontal
  for (r = 0; r < ROWS; r++) {
    for (c = 0; c < COLS - 2; c++) {
      e = board[r][c];
      if (e && e === board[r][c+1] && e === board[r][c+2]) {
        end = c + 2;
        while (end + 1 < COLS && board[r][end+1] === e) end++;
        for (k = c; k <= end; k++) matched[r + ',' + k] = [r, k];
      }
    }
  }
  // Vertical
  for (c = 0; c < COLS; c++) {
    for (r = 0; r < ROWS - 2; r++) {
      e = board[r][c];
      if (e && e === board[r+1][c] && e === board[r+2][c]) {
        end = r + 2;
        while (end + 1 < ROWS && board[end+1][c] === e) end++;
        for (k = r; k <= end; k++) matched[k + ',' + c] = [k, c];
      }
    }
  }
  var result = [];
  for (var key in matched) result.push(matched[key]);
  return result;
}

function findHint(board) {
  var dirs = [[0,1],[1,0]], r, c, i, dr, dc, nr, nc, tmp, ok;
  for (r = 0; r < ROWS; r++) {
    for (c = 0; c < COLS; c++) {
      for (i = 0; i < dirs.length; i++) {
        dr = dirs[i][0]; dc = dirs[i][1];
        nr = r + dr; nc = c + dc;
        if (nr >= ROWS || nc >= COLS) continue;
        tmp = board[r][c]; board[r][c] = board[nr][nc]; board[nr][nc] = tmp;
        ok = getMatches(board).length > 0;
        tmp = board[r][c]; board[r][c] = board[nr][nc]; board[nr][nc] = tmp;
        if (ok) return [[r,c],[nr,nc]];
      }
    }
  }
  return null;
}

// ── RENDER ───────────────────────────────────────
function render() {
  var boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      (function(row, col) {
        var div = document.createElement('div');
        div.className = 'cell';
        div.id = 'c-' + row + '-' + col;
        div.textContent = G.board[row][col] || '';
        div.addEventListener('click', function() { onCellClick(row, col); });
        boardEl.appendChild(div);
      })(r, c);
    }
  }
}

function cellEl(r, c) { return document.getElementById('c-' + r + '-' + c); }

function syncCell(r, c) {
  var el = cellEl(r, c);
  if (el) el.textContent = G.board[r][c] || '';
}

function updateUI() {
  var lv = LEVELS[G.levelIdx];
  document.getElementById('hud-score').textContent = G.score.toLocaleString();
  document.getElementById('hud-level').textContent = lv.id;
  document.getElementById('hud-moves').textContent = G.moves;
  document.getElementById('lname').textContent = lv.name;

  var pct = Math.min(100, Math.round((G.score / lv.target) * 100));
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-label').textContent = G.score.toLocaleString() + ' / ' + lv.target.toLocaleString();

  // Level dots
  var track = document.getElementById('level-track');
  track.innerHTML = '';
  for (var i = 0; i < LEVELS.length; i++) {
    var dot = document.createElement('div');
    dot.className = 'l-dot';
    if (i < G.levelIdx) { dot.classList.add('done'); dot.textContent = '✓'; }
    else if (i === G.levelIdx) { dot.classList.add('active'); dot.textContent = LEVELS[i].id; }
    else { dot.textContent = LEVELS[i].id; }
    track.appendChild(dot);
    if (i < LEVELS.length - 1) {
      var line = document.createElement('div');
      line.className = 'l-line';
      var fill = document.createElement('div');
      fill.className = 'l-line-fill';
      fill.style.width = i < G.levelIdx ? '100%' : '0%';
      line.appendChild(fill);
      track.appendChild(line);
    }
  }
}

// ── CELL CLICK ───────────────────────────────────
function onCellClick(r, c) {
  if (G.busy) return;
  clearHint();

  if (G.selected !== null) {
    var sr = G.selected.r, sc = G.selected.c;
    var selEl = cellEl(sr, sc);
    if (selEl) selEl.classList.remove('selected');

    if (sr === r && sc === c) { G.selected = null; return; }

    var dist = Math.abs(sr - r) + Math.abs(sc - c);
    if (dist !== 1) {
      if (selEl) {
        selEl.classList.add('do-shake');
        setTimeout(function() { if(selEl) selEl.classList.remove('do-shake'); }, 380);
      }
      G.selected = { r:r, c:c };
      var newEl = cellEl(r, c);
      if (newEl) newEl.classList.add('selected');
      return;
    }

    G.selected = null;
    attemptSwap(sr, sc, r, c);
    return;
  }

  G.selected = { r:r, c:c };
  var el = cellEl(r, c);
  if (el) el.classList.add('selected');
}

function attemptSwap(r1, c1, r2, c2) {
  G.busy = true;

  var tmp = G.board[r1][c1];
  G.board[r1][c1] = G.board[r2][c2];
  G.board[r2][c2] = tmp;

  var matches = getMatches(G.board);

  if (matches.length === 0) {
    // Swap back
    tmp = G.board[r1][c1];
    G.board[r1][c1] = G.board[r2][c2];
    G.board[r2][c2] = tmp;
    syncCell(r1, c1); syncCell(r2, c2);
    var a = cellEl(r1, c1), b = cellEl(r2, c2);
    if (a) { a.classList.add('do-shake'); setTimeout(function() { if(a)a.classList.remove('do-shake'); }, 380); }
    if (b) { b.classList.add('do-shake'); setTimeout(function() { if(b)b.classList.remove('do-shake'); }, 380); }
    G.busy = false;
    return;
  }

  G.moves--;
  syncCell(r1, c1); syncCell(r2, c2);
  updateUI();
  resolveAll();
}

// ── RESOLVE CASCADE ──────────────────────────────
function resolveAll(cascade) {
  if (cascade === undefined) cascade = 0;
  var matches = getMatches(G.board);
  if (matches.length === 0) {
    G.busy = false;
    if (!findHint(G.board)) doShuffle(true);
    var lv = LEVELS[G.levelIdx];
    if (G.score >= lv.target) { setTimeout(showWin, 200); return; }
    if (G.moves <= 0) { setTimeout(showFail, 200); return; }
    return;
  }

  cascade++;
  var mult = cascade >= 3 ? 3 : cascade >= 2 ? 1.5 : 1;
  var bonus = matches.length >= 5 ? 2 : 1;
  var pts = Math.round(matches.length * 60 * mult * bonus);
  G.score += pts;

  // Pop animation
  for (var i = 0; i < matches.length; i++) {
    var el = cellEl(matches[i][0], matches[i][1]);
    if (el) {
      el.classList.add('do-pop');
      spawnBurst(el, 7);
    }
  }

  // Show score float
  if (matches.length > 0) {
    var mid = matches[Math.floor(matches.length / 2)];
    var midEl = cellEl(mid[0], mid[1]);
    if (midEl) floatScore(midEl, '+' + pts + (cascade > 1 ? ' 🔥' : ''));
  }

  updateUI();

  // After pop, drop and refill
  setTimeout(function() {
    var lv = LEVELS[G.levelIdx];
    // Clear matched
    for (var j = 0; j < matches.length; j++) {
      G.board[matches[j][0]][matches[j][1]] = '';
    }
    // Drop
    for (var c = 0; c < COLS; c++) {
      var write = ROWS - 1;
      for (var r = ROWS - 1; r >= 0; r--) {
        if (G.board[r][c] !== '') {
          G.board[write][c] = G.board[r][c];
          if (write !== r) G.board[r][c] = '';
          write--;
        }
      }
      while (write >= 0) {
        G.board[write][c] = randEmoji(lv.emojis);
        write--;
      }
    }
    // Re-render with drop
    for (var rr = 0; rr < ROWS; rr++) {
      for (var cc = 0; cc < COLS; cc++) {
        (function(row, col) {
          var elx = cellEl(row, col);
          if (!elx) return;
          elx.classList.remove('do-pop', 'do-drop', 'selected', 'do-shake');
          elx.textContent = G.board[row][col] || '';
          if (G.board[row][col]) {
            elx.classList.add('do-drop');
            elx.style.animationDelay = (col * 15) + 'ms';
            setTimeout(function() {
              if (elx) { elx.classList.remove('do-drop'); elx.style.animationDelay = ''; }
            }, 450);
          }
        })(rr, cc);
      }
    }
    setTimeout(function() { resolveAll(cascade); }, 380);
  }, 430);
}

// ── HINT ─────────────────────────────────────────
function showHint() {
  if (G.busy) return;
  clearHint();
  var hint = findHint(G.board);
  if (!hint) return;
  G.hintCells = hint;
  for (var i = 0; i < hint.length; i++) {
    var el = cellEl(hint[i][0], hint[i][1]);
    if (el) el.classList.add('hint');
  }
  setTimeout(clearHint, 2000);
}

function clearHint() {
  for (var i = 0; i < G.hintCells.length; i++) {
    var el = cellEl(G.hintCells[i][0], G.hintCells[i][1]);
    if (el) el.classList.remove('hint');
  }
  G.hintCells = [];
}

// ── SHUFFLE ──────────────────────────────────────
function doShuffle(silent) {
  if (!silent && G.busy) return;
  var lv = LEVELS[G.levelIdx];
  var flat = [], r, c;
  for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) flat.push(G.board[r][c]);
  for (var i = flat.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = flat[i]; flat[i] = flat[j]; flat[j] = t;
  }
  for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) G.board[r][c] = flat[r * COLS + c];
  var tries = 0;
  while (!findHint(G.board) && tries < 30) {
    for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) G.board[r][c] = randEmoji(lv.emojis);
    tries++;
  }
  // Animate all cells as drop
  for (r = 0; r < ROWS; r++) {
    for (c = 0; c < COLS; c++) {
      (function(row, col) {
        var el = cellEl(row, col);
        if (!el) return;
        el.classList.remove('do-pop','do-drop','selected','do-shake','hint');
        el.textContent = G.board[row][col] || '';
        el.classList.add('do-drop');
        el.style.animationDelay = (col * 15) + 'ms';
        setTimeout(function() {
          if (el) { el.classList.remove('do-drop'); el.style.animationDelay = ''; }
        }, 450);
      })(r, c);
    }
  }
}

// ── LEVEL MANAGEMENT ─────────────────────────────
function startLevel(idx) {
  G.levelIdx = idx;
  G.moves = LEVELS[idx].moves;
  G.board = makeBoard(LEVELS[idx].emojis);
  G.selected = null;
  G.busy = false;
  G.hintCells = [];
  hideOverlays();
  render();
  updateUI();
}

function retryLevel() { G.score = 0; startLevel(G.levelIdx); }
function fullRestart() { G.score = 0; startLevel(0); }

function showWin() {
  var lv = LEVELS[G.levelIdx];
  var bonus = G.moves * 25;
  G.score += bonus;
  updateUI();
  var ratio = G.score / lv.target;
  var stars = ratio >= 1.6 ? '⭐⭐⭐' : ratio >= 1.2 ? '⭐⭐' : '⭐';
  document.getElementById('win-title').textContent = 'Level ' + lv.id + ' Complete!';
  document.getElementById('win-stars').textContent = stars;
  document.getElementById('win-msg').textContent = '"' + lv.name + '" cleared! +' + bonus.toLocaleString() + ' move bonus!';
  var nextBtn = document.getElementById('btn-next');
  if (G.levelIdx >= LEVELS.length - 1) {
    nextBtn.textContent = '🏆 See Results';
    nextBtn.onclick = function() {
      hideOverlays();
      document.getElementById('final-score').textContent = G.score.toLocaleString();
      document.getElementById('ov-done').classList.add('show');
    };
  } else {
    nextBtn.textContent = 'Next Level →';
    (function(nextIdx) {
      nextBtn.onclick = function() { G.score = 0; startLevel(nextIdx); };
    })(G.levelIdx + 1);
  }
  document.getElementById('ov-win').classList.add('show');
  startConfetti();
}

function showFail() {
  var lv = LEVELS[G.levelIdx];
  document.getElementById('fail-msg').textContent =
    'You scored ' + G.score.toLocaleString() + ' but needed ' + lv.target.toLocaleString() + '. So close!';
  document.getElementById('ov-fail').classList.add('show');
}

function hideOverlays() {
  var ovs = document.querySelectorAll('.overlay');
  for (var i = 0; i < ovs.length; i++) ovs[i].classList.remove('show');
  stopConfetti();
}

// ── PARTICLES ─────────────────────────────────────
var fxCanvas = document.getElementById('fx-canvas');
var fxCtx = fxCanvas.getContext('2d');
var fxParts = [];

function resizeFX() { fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; }
resizeFX();
window.addEventListener('resize', resizeFX);

function spawnBurst(el, count) {
  var rect = el.getBoundingClientRect();
  var cx = rect.left + rect.width / 2;
  var cy = rect.top + rect.height / 2;
  var cols = ['#ff6fd8','#7b61ff','#00e5ff','#ffd600','#00e676','#fff'];
  for (var i = 0; i < count; i++) {
    var angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    var spd = 2.5 + Math.random() * 4.5;
    fxParts.push({ x:cx, y:cy, vx:Math.cos(angle)*spd, vy:Math.sin(angle)*spd-2, alpha:1, r:3+Math.random()*4, col:cols[Math.floor(Math.random()*cols.length)] });
  }
}

function tickFX() {
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  fxParts = fxParts.filter(function(p) { return p.alpha > 0.03; });
  for (var i = 0; i < fxParts.length; i++) {
    var p = fxParts[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.alpha *= 0.92;
    fxCtx.save();
    fxCtx.globalAlpha = p.alpha;
    fxCtx.fillStyle = p.col;
    fxCtx.shadowColor = p.col; fxCtx.shadowBlur = 5;
    fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2); fxCtx.fill();
    fxCtx.restore();
  }
  requestAnimationFrame(tickFX);
}
tickFX();

// ── FLOATING SCORE ────────────────────────────────
function floatScore(el, text) {
  var rect = el.getBoundingClientRect();
  var div = document.createElement('div');
  div.className = 'fscore';
  div.textContent = text;
  div.style.left = (rect.left + rect.width / 2 - 30) + 'px';
  div.style.top  = rect.top + 'px';
  document.body.appendChild(div);
  div.addEventListener('animationend', function() { if(div.parentNode) div.parentNode.removeChild(div); });
}

// ── CONFETTI ──────────────────────────────────────
var confCv = document.getElementById('confetti-canvas');
var confCtx = confCv.getContext('2d');
var confBits = [], confRunning = false;

function startConfetti() {
  confCv.width = window.innerWidth; confCv.height = window.innerHeight;
  confCv.style.display = 'block'; confRunning = true; confBits = [];
  var colors = ['#ff6fd8','#7b61ff','#00e5ff','#ffd600','#00e676','#ff5252'];
  for (var i = 0; i < 140; i++) {
    confBits.push({ x:Math.random()*confCv.width, y:-20-Math.random()*300,
      w:7+Math.random()*9, h:4+Math.random()*6,
      col:colors[Math.floor(Math.random()*colors.length)],
      ang:Math.random()*360, spin:(Math.random()-0.5)*7,
      vx:(Math.random()-0.5)*2.5, vy:2.5+Math.random()*4 });
  }
  runConf();
}

function runConf() {
  if (!confRunning) return;
  confCtx.clearRect(0, 0, confCv.width, confCv.height);
  for (var i = 0; i < confBits.length; i++) {
    var b = confBits[i];
    b.x += b.vx; b.y += b.vy; b.ang += b.spin;
    confCtx.save();
    confCtx.translate(b.x, b.y); confCtx.rotate(b.ang * Math.PI / 180);
    confCtx.fillStyle = b.col; confCtx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
    confCtx.restore();
    if (b.y > confCv.height) b.y = -10;
  }
  requestAnimationFrame(runConf);
}

function stopConfetti() { confRunning = false; confCv.style.display = 'none'; }

// ── INIT ──────────────────────────────────────────
startLevel(0);
</script>
